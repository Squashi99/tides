<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --fg: #e8e8e8;
      --muted: #6b6b6b;
      --card: #161616;
      --border: #2a2a2a;
      --win: #16a34a;
      --loss: #dc2626;
      --win-bg: rgba(22, 163, 74, 0.12);
      --loss-bg: rgba(220, 38, 38, 0.12);
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    .address { font-family: monospace; font-size: 0.85rem; color: var(--muted); }
    .controls { display: flex; gap: 12px; align-items: center; }
    button {
      background: var(--card); border: 1px solid var(--border);
      color: var(--fg); padding: 8px 16px; border-radius: 6px;
      cursor: pointer; font-size: 0.875rem; transition: all 0.15s;
    }
    button:hover { border-color: var(--accent); background: #1a1a1a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .month-nav { display: flex; gap: 8px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-name {
      text-align: center; padding: 8px; font-size: 0.75rem;
      font-weight: 600; color: var(--muted); text-transform: uppercase;
    }
    .day {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; min-height: 120px; padding: 8px;
      display: flex; flex-direction: column; position: relative;
    }
    .day.empty { background: transparent; border: none; min-height: 120px; }
    .day-number { font-weight: 600; font-size: 0.9rem; }
    .day.today .day-number { color: var(--accent); }
    .pnl { margin-top: auto; font-size: 0.8rem; font-weight: 500; }
    .pnl.win { color: var(--win); }
    .pnl.loss { color: var(--loss); }
    .pnl.zero { color: var(--muted); }
    .day.win { background: var(--win-bg); border-color: var(--win); }
    .day.loss { background: var(--loss-bg); border-color: var(--loss); }
    .trades-count { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
    .legend { display: flex; gap: 24px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.85rem; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
    .total-row { display: flex; justify-content: space-between; margin-top: 16px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    .total-label { color: var(--muted); }
    .total-value { font-weight: 600; font-size: 1.1rem; }
    .total-value.win { color: var(--win); }
    .total-value.loss { color: var(--loss); }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-value { font-size: 1.1rem; font-weight: 600; }
    .stat-value.win { color: var(--win); }
    .stat-value.loss { color: var(--loss); }
    .stat-value.neutral { color: var(--fg); }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .error { text-align: center; padding: 20px; color: var(--loss); background: var(--loss-bg); border: 1px solid var(--loss); border-radius: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 id="monthTitle">Loading...</h1>
        <div class="address" id="addressDisplay"></div>
      </div>
      <div class="controls">
        <div class="month-nav">
          <button id="prevMonth" aria-label="Previous month">‹</button>
          <button id="nextMonth" aria-label="Next month">›</button>
        </div>
        <button id="fetchBtn">Fetch PnL Data</button>
      </div>
    </header>

    <div id="errorBox" class="error" style="display:none;"></div>
    <div id="loading" class="loading">Click "Fetch PnL Data" to load Hyperliquid fills</div>

    <div class="total-row" id="totalRow" style="display:none; margin-bottom: 16px;">
      <span class="total-label">Month Total</span>
      <span class="total-value" id="totalValue">$0.00</span>
    </div>

    <div class="stats-row" id="statsRow" style="display:none; margin-bottom: 16px;"></div>

    <div class="calendar" id="calendar" style="display:none;">
      <div class="day-name">Sun</div>
      <div class="day-name">Mon</div>
      <div class="day-name">Tue</div>
      <div class="day-name">Wed</div>
      <div class="day-name">Thu</div>
      <div class="day-name">Fri</div>
      <div class="day-name">Sat</div>
    </div>
  </div>

<script>
const ADDRESS = '0x26Fb8438f3f598B8694F04161c2163988a9BC538';
const API_BASE = 'https://api.hyperliquid.xyz/info';

let currentDate = new Date();
currentDate.setDate(1);
let pnlData = {};

const $ = (id) => document.getElementById(id);
const dayKey = (d) => d.toISOString().split('T')[0];

function formatMonth(d) {
  return d.toLocaleString('default', { month: 'long', year: 'numeric' });
}

function renderCalendar() {
  $('monthTitle').textContent = formatMonth(currentDate);
  const calendar = $('calendar');
  calendar.querySelectorAll('.day, .day.empty').forEach(el => el.remove());

  const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
  const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
  const startOffset = firstDay.getDay();
  const today = new Date(); today.setHours(0,0,0,0);
  const currentMonthKey = currentDate.toISOString().slice(0,7);

  for (let i = 0; i < startOffset; i++) {
    const empty = document.createElement('div');
    empty.className = 'day empty';
    calendar.appendChild(empty);
  }

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(currentDate.getFullYear(), currentDate.getMonth(), d);
    const key = dayKey(date);
    const data = pnlData[key] || { pnl: 0, trades: 0 };
    const isToday = date.getTime() === today.getTime() && currentMonthKey === today.toISOString().slice(0,7);

    const cell = document.createElement('div');
    cell.className = 'day';
    if (isToday) cell.classList.add('today');
    if (data.trades > 0) {
      cell.classList.add(data.pnl >= 0 ? 'win' : 'loss');
    }

    cell.innerHTML = `
      <div class="day-number">${d}</div>
      <div class="pnl ${data.trades === 0 ? 'zero' : data.pnl >= 0 ? 'win' : 'loss'}">
        ${data.trades === 0 ? '—' : (data.pnl >= 0 ? '+' : '') + data.pnl.toFixed(2)}
      </div>
      <div class="trades-count">${data.trades} trade${data.trades !== 1 ? 's' : ''}</div>
    `;
    calendar.appendChild(cell);
  }

  const monthPnl = Object.entries(pnlData)
    .filter(([k]) => k.startsWith(currentMonthKey))
    .reduce((sum, [, v]) => sum + v.pnl, 0);

  // Compute stats for current month
  const monthDays = Object.entries(pnlData)
    .filter(([k, v]) => k.startsWith(currentMonthKey) && v.trades > 0);
  const winningDays = monthDays.filter(([, v]) => v.pnl > 0);
  const losingDays = monthDays.filter(([, v]) => v.pnl < 0);
  const totalTrades = monthDays.reduce((sum, [, v]) => sum + v.trades, 0);
  const winningTrades = winningDays.reduce((sum, [, v]) => sum + v.trades, 0);
  const winRate = totalTrades > 0 ? (winningTrades / totalTrades * 100).toFixed(1) : '0.0';
  const biggestWin = winningDays.length > 0 ? Math.max(...winningDays.map(([, v]) => v.pnl)) : 0;
  const biggestLoss = losingDays.length > 0 ? Math.min(...losingDays.map(([, v]) => v.pnl)) : 0;
  const avgWin = winningDays.length > 0 ? (winningDays.reduce((s, [, v]) => s + v.pnl, 0) / winningDays.length).toFixed(2) : '0.00';
  const avgLoss = losingDays.length > 0 ? (losingDays.reduce((s, [, v]) => s + v.pnl, 0) / losingDays.length).toFixed(2) : '0.00';
  const profitFactor = losingDays.length > 0 && Math.abs(losingDays.reduce((s, [, v]) => s + v.pnl, 0)) > 0
    ? (winningDays.reduce((s, [, v]) => s + v.pnl, 0) / Math.abs(losingDays.reduce((s, [, v]) => s + v.pnl, 0))).toFixed(2)
    : winningDays.length > 0 ? '∞' : '0.00';

  const statsHtml = `
    <div class="stat-card">
      <div class="stat-label">Green Days %</div>
      <div class="stat-value win">${monthDays.length > 0 ? (winningDays.length / monthDays.length * 100).toFixed(1) : '0.0'}%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Trade Win Rate</div>
      <div class="stat-value neutral">${winRate}%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Biggest Win (Day)</div>
      <div class="stat-value win">+${biggestWin.toFixed(2)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Biggest Loss (Day)</div>
      <div class="stat-value loss">${biggestLoss.toFixed(2)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Win / Avg Loss</div>
      <div class="stat-value neutral">+${avgWin} / ${avgLoss}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Profit Factor</div>
      <div class="stat-value ${profitFactor === '∞' || parseFloat(profitFactor) >= 1 ? 'win' : 'loss'}">${profitFactor}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Trades</div>
      <div class="stat-value neutral">${totalTrades}</div>
    </div>
  `;
  $('statsRow').innerHTML = statsHtml;
  $('statsRow').style.display = 'grid';

  $('totalValue').textContent = (monthPnl >= 0 ? '+' : '') + monthPnl.toFixed(2);
  $('totalValue').className = 'total-value ' + (monthPnl >= 0 ? 'win' : 'loss');
  $('totalRow').style.display = 'flex';
  $('calendar').style.display = 'grid';
  $('loading').style.display = 'none';
}

async function fetchPnL() {
  $('fetchBtn').disabled = true;
  $('fetchBtn').textContent = 'Fetching...';
  $('errorBox').style.display = 'none';

  const startOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
  const endOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0, 23, 59, 59);
  const startMs = startOfMonth.getTime();
  const endMs = endOfMonth.getTime();

  try {
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'userFills',
        user: ADDRESS,
        startTime: startMs,
        endTime: endMs
      })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const fills = await res.json();

    pnlData = {};
    for (const fill of fills) {
      const fillTime = new Date(fill.time);
      const key = dayKey(fillTime);
      const closedPnl = parseFloat(fill.closedPnl || 0);
      const fee = parseFloat(fill.fee || 0) * -1;
      const pnl = closedPnl + fee;
      if (!pnlData[key]) pnlData[key] = { pnl: 0, exits: 0 };
      pnlData[key].pnl += pnl;
      if (Math.abs(closedPnl) > 0.01) {
        pnlData[key].exits += 1;
      }
    }
    for (const data of Object.values(pnlData)) {
      data.trades = data.exits;
      delete data.exits;
    }

    renderCalendar();
  } catch (err) {
    $('errorBox').textContent = `Failed to fetch: ${err.message}. API may be down.`;
    $('errorBox').style.display = 'block';
    loadMockData();
  } finally {
    $('fetchBtn').disabled = false;
    $('fetchBtn').textContent = 'Fetch PnL Data';
  }
}

function loadMockData() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  pnlData = {
    [`${year}-${String(month+1).padStart(2,'0')}-02`]: { pnl: 342.15, trades: 4 },
    [`${year}-${String(month+1).padStart(2,'0')}-05`]: { pnl: -128.50, trades: 2 },
    [`${year}-${String(month+1).padStart(2,'0')}-08`]: { pnl: 567.80, trades: 6 },
    [`${year}-${String(month+1).padStart(2,'0')}-12`]: { pnl: -89.20, trades: 3 },
    [`${year}-${String(month+1).padStart(2,'0')}-15`]: { pnl: 234.00, trades: 5 },
    [`${year}-${String(month+1).padStart(2,'0')}-19`]: { pnl: -45.60, trades: 1 },
    [`${year}-${String(month+1).padStart(2,'0')}-22`]: { pnl: 712.30, trades: 7 },
    [`${year}-${String(month+1).padStart(2,'0')}-26`]: { pnl: -201.40, trades: 2 },
    [`${year}-${String(month+1).padStart(2,'0')}-29`]: { pnl: 156.75, trades: 3 },
  };
  renderCalendar();
  $('errorBox').textContent = 'Showing mock data (API unavailable). Click Fetch to retry.';
  $('errorBox').style.display = 'block';
}

$('prevMonth').onclick = () => {
  currentDate.setMonth(currentDate.getMonth() - 1);
  fetchPnL();
};
$('nextMonth').onclick = () => {
  currentDate.setMonth(currentDate.getMonth() + 1);
  fetchPnL();
};
$('fetchBtn').onclick = fetchPnL;

loadMockData();
</script>
</body>
</html>
